<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520"
     role="img" aria-label="Ilustración de atención en salud">
  <!--
    Ilustración decorativa de la portada: motivos de atención en salud
    (pulso, escudo de cuidado, cruz médica y tabletas) dibujados en la
    paleta terracota del sistema.

    Es un SVG propio y no una fotografía: pesa unos pocos kilobytes, se ve
    nítido en cualquier pantalla, no depende de ninguna CDN ni de licencias
    de terceros, y al ser vectorial se tiñe con los colores de la marca.
    En la página se usa de fondo con poca opacidad, por eso los trazos son
    gruesos y las formas grandes: a baja opacidad, el detalle fino se pierde.
  -->
  <defs>
    <linearGradient id="calido" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e07b36"/>
      <stop offset="1" stop-color="#a8470e"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#calido)" stroke-linecap="round" stroke-linejoin="round">

    <!-- Línea de pulso cardiaco, el motivo principal -->
    <path d="M40 300 H200 l28 -74 34 150 30 -96 26 48 h74"
          stroke-width="9"/>
    <path d="M432 300 h96 l22 -46 26 92 24 -66 20 36 h240"
          stroke-width="9" opacity=".55"/>

    <!-- Escudo: la idea de cuidado y resguardo -->
    <path d="M636 96c46 22 84 28 84 28v74c0 58-38 96-84 116-46-20-84-58-84-116v-74s38-6 84-28Z"
          stroke-width="8" opacity=".85"/>
    <path d="M636 156v76M598 194h76" stroke-width="10" opacity=".85"/>

    <!-- Cruz médica en un círculo -->
    <circle cx="196" cy="150" r="66" stroke-width="8" opacity=".7"/>
    <path d="M196 116v68M162 150h68" stroke-width="11" opacity=".7"/>

    <!-- Estetoscopio esquemático -->
    <path d="M300 396c0 42 34 76 76 76s76-34 76-76v-40" stroke-width="8" opacity=".5"/>
    <path d="M300 356v40M452 356v-8" stroke-width="8" opacity=".5"/>
    <circle cx="452" cy="336" r="20" stroke-width="8" opacity=".5"/>

    <!-- Tabletas -->
    <rect x="700" y="356" width="112" height="56" rx="28" stroke-width="8" opacity=".6"/>
    <path d="M756 356v56" stroke-width="8" opacity=".6"/>
  </g>

  <!-- Puntos sueltos: dan textura al fondo sin competir con el texto -->
  <g fill="#e07b36" opacity=".22">
    <circle cx="96" cy="432" r="7"/>
    <circle cx="140" cy="466" r="5"/>
    <circle cx="520" cy="130" r="6"/>
    <circle cx="482" cy="176" r="4"/>
    <circle cx="828" cy="240" r="6"/>
    <circle cx="864" cy="286" r="4"/>
  </g>
</svg>
