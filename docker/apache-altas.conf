# =====================================================================
# Configuracion de Apache para el sistema de Alta Solicitada.
#
# IMPORTANTE: las reglas de proteccion de /uploads estan aqui y no solo en
# uploads/altas/.htaccess, porque en CapRover esa carpeta se monta como
# volumen persistente y el .htaccess del repositorio queda oculto bajo el
# punto de montaje. Esta configuracion vive en la imagen y siempre se aplica.
# =====================================================================

ServerTokens Prod
ServerSignature Off

# Las credenciales llegan como variables de entorno del contenedor.
# PassEnv las hace visibles para PHP (config.php las lee con getenv()).
PassEnv DB_HOST
PassEnv DB_PORT
PassEnv DB_NAME
PassEnv DB_USER
PassEnv DB_PASS
PassEnv APP_DEBUG
PassEnv APP_TIMEZONE

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# ---------------------------------------------------------------------
# Documentos subidos: se sirven, pero jamas se ejecutan.
# ---------------------------------------------------------------------
<Directory /var/www/html/uploads>
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted

    php_admin_flag engine off

    RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .php8 .phar
    RemoveType .php .phtml .php3 .php4 .php5 .php7 .php8 .phar

    <FilesMatch "\.(?i:php|phps|phtml|php[3-8]|phar|cgi|pl|py|sh|htaccess)$">
        Require all denied
    </FilesMatch>
</Directory>

# ---------------------------------------------------------------------
# Carpetas internas: no deben ser accesibles desde el navegador.
# ---------------------------------------------------------------------
<Directory /var/www/html/data>
    Require all denied
</Directory>

<Directory /var/www/html/lib>
    Require all denied
</Directory>

<Directory /var/www/html/templates>
    Require all denied
</Directory>

<Directory /var/www/html/docker>
    Require all denied
</Directory>

# Credenciales, esquemas de base de datos y documentacion.
<FilesMatch "^(config\.local\.php|config\.example\.php|\.env.*|Dockerfile|captain-definition)$">
    Require all denied
</FilesMatch>

<FilesMatch "\.(?i:sql|md|log|ini|sh)$">
    Require all denied
</FilesMatch>

# Cualquier archivo oculto (.git, .htpasswd, etc.).
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# ---------------------------------------------------------------------
# Cabeceras de seguridad.
# ---------------------------------------------------------------------
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
    # El sistema maneja datos de salud: que los buscadores no lo indexen.
    Header always set X-Robots-Tag "noindex, nofollow"
</IfModule>
