; Ajustes de PHP para el sistema de Alta Solicitada.

; El limite de la aplicacion es de 10 MB por adjunto; se deja algo de holgura
; para la sobrecarga del multipart/form-data.
upload_max_filesize = 12M
post_max_size = 14M
max_file_uploads = 5

memory_limit = 256M
max_execution_time = 60

; En produccion los errores no se muestran al cliente: se registran en el log
; del contenedor, visible desde CapRover.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

date.timezone = America/La_Paz

session.cookie_httponly = 1
session.cookie_samesite = Lax
; La aplicacion se sirve solo por HTTPS detras del proxy de CapRover.
session.cookie_secure = 1
